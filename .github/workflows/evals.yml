name: evals

# The nightly cron is disabled (2026-09-06). It had failed every night since
# at least 2026-08-31, for two structural reasons rather than a flaky run:
#
#   1. **No baseline to diff.** `--compare` fails a run against the previous
#      stored one, but the `postgres` service container below is created fresh
#      per run, so `eval_runs` is always empty. There is nothing to compare to
#      and never will be without a persisted database.
#   2. **Wrong embedding model.** The env pins
#      `openai/text-embedding-3-small` while every number in the README and in
#      ADR-002/010/012/015 was measured on `gemini/gemini-embedding-001`. A
#      nightly that scores a different retriever than the documented one
#      cannot regress-test the documented claims.
#
# A red nightly that nobody can act on trains people to ignore CI, and it
# burns runner minutes doing it. Manual and label-triggered runs still work
# and are the honest interface: run the evals when you have changed retrieval,
# against a database that holds a baseline.
#
# To restore the nightly, both causes need fixing — see README §10: point CI
# at a persistent Postgres (so `eval_runs` accumulates) and give it the Gemini
# key, or drop `--compare` and gate on absolute thresholds only.
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

jobs:
  evals:
    # Manual, or when a PR gets the `run-evals` label.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.label.name == 'run-evals'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: pandu
          POSTGRES_PASSWORD: pandu
          POSTGRES_DB: pandu
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pandu" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pandu:pandu@localhost:5432/pandu
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_CHAT_MODEL: openai/gpt-4o-mini
      AI_EMBED_MODEL: openai/text-embedding-3-small
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync (with eval group)
        run: uv sync --frozen --group eval
      - name: Fetch corpus
        working-directory: .
        run: bash scripts/fetch_corpus.sh
      - name: Migrate + ingest corpus
        run: |
          uv run alembic upgrade head
          uv run python -m evals.ingest_corpus
      - name: Run eval suite
        # --compare diffs against the previous stored run and fails on any
        # per-metric regression, even when every absolute threshold passes: a
        # mean can hold steady while some examples break and others improve.
        run: uv run python -m evals.run --retrieval-only --compare
        # Thresholds are enforced inside evals.run (tightening-only rule; ADR-008).
      - name: Retrieval configuration sweep (evidence for ADR-010)
        # Reported, never gated: this quantifies what each arm and the
        # reranker buy, which is a measurement, not a pass/fail claim.
        continue-on-error: true
        run: uv run python -m evals.sweep --arms hybrid,dense,lexical --k 1,3,5,10
