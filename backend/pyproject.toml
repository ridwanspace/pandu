[project]
name = "pandu-backend"
version = "0.1.0"
description = "Pandu — self-hostable enterprise RAG platform: hybrid retrieval, RRF, reranking, multi-provider LLM routing, evals, and cost tracking."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Muhammad Ridwan" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115.12",
  "uvicorn[standard]>=0.34.2",
  "pydantic>=2.10",
  "pydantic-settings>=2.8",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "arq>=0.26",
  "redis>=5.2",
  "httpx>=0.28",
  "structlog>=24.4",
  "python-multipart>=0.0.20",
  "openai>=1.60",
  "google-genai>=1.0",
  "tiktoken>=0.8",
]

[project.optional-dependencies]
# Docling parser (pulls torch — heavy). Without it the worker falls back to the
# built-in text/markdown parser; PDF ingestion requires this extra.
parsing = ["docling>=2.15"]
# Local cross-encoder reranking (torch). See ADR-010.
rerank-local = ["sentence-transformers>=3.3"]
# Langfuse tracing adapter — the app runs fine without it (no-op tracer).
observability = ["langfuse>=2.57"]
# Optional Qdrant dense-search adapter (ADR-002 scale-out path). Default is
# SEARCH_INDEX=pg; without this extra the Qdrant adapter is never imported.
qdrant = ["qdrant-client>=1.12"]

[dependency-groups]
dev = [
  "mypy>=1.16",
  "ruff>=0.11.9",
  "import-linter>=2.2",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.1.1",
  "pytest-mock>=3.14",
  "polyfactory>=2.18",
  "testcontainers[postgres]>=4.9",
  "schemathesis>=3.39",
  "bandit[toml]>=1.8.6",
  "pip-audit>=2.7",
  "pre-commit>=4.2",
  "greenlet>=3.1",
]
eval = [
  "ragas>=0.2.10",
  "datasets>=3.2",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
exclude = [".venv", "build", "dist", "migrations"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "S", "UP", "W", "ASYNC", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S608"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["app"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_configs = true
no_implicit_reexport = true
exclude = "(^\\.venv/|^build/|^dist/|^migrations/)"

[[tool.mypy.overrides]]
module = ["docling.*", "sentence_transformers.*", "langfuse.*", "arq.*", "testcontainers.*", "ragas.*", "datasets.*", "qdrant_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires docker (testcontainers)",
]

[tool.coverage.run]
source = ["src/app"]
branch = true

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.bandit]
exclude_dirs = [".venv", "tests", "migrations"]

# ── Architecture contracts (CI-enforced; see ADR-001) ────────────────────────
[tool.importlinter]
root_packages = ["app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Module layers: dependencies point inward (presentation/infrastructure -> application -> domain)"
type = "layers"
layers = [
  "presentation : infrastructure",
  "application",
  "domain",
]
containers = [
  "app.modules.documents",
  "app.modules.retrieval",
  "app.modules.chat",
  "app.modules.evaluation",
  "app.shared",
]
exhaustive = false

[[tool.importlinter.contracts]]
name = "Modules are independent (cross-module only via explicit application-layer seams)"
type = "independence"
modules = [
  "app.modules.documents",
  "app.modules.retrieval",
  "app.modules.chat",
  "app.modules.evaluation",
]
ignore_imports = [
  # chat orchestrates retrieval through its application-layer use case (ADR-001)
  "app.modules.chat.application.* -> app.modules.retrieval.application.*",
  # evaluation replays the retrieval pipeline to score it (the judge talks to
  # the shared LLMProvider port directly, so no chat-module seam is needed)
  "app.modules.evaluation.application.* -> app.modules.retrieval.application.*",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free (no FastAPI/SQLAlchemy/Pydantic/SDKs in any domain layer)"
type = "forbidden"
source_modules = [
  "app.modules.*.domain",
  "app.shared.domain",
]
forbidden_modules = [
  "fastapi",
  "starlette",
  "sqlalchemy",
  "pydantic",
  "pydantic_settings",
  "openai",
  "google",
  "redis",
  "arq",
  "httpx",
  "docling",
  "langfuse",
]

[[tool.importlinter.contracts]]
name = "Vendor SDKs are quarantined in shared/infrastructure/ai"
type = "forbidden"
source_modules = [
  "app.modules.*",
  "app.shared.domain",
  "app.shared.application",
  "app.shared.presentation",
]
forbidden_modules = [
  "openai",
  "google",
  "langfuse",
  "sentence_transformers",
]
